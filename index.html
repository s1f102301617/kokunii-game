<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#070d13">
  <title>恐怖の森 — こくにいVer.</title>
  <link rel="stylesheet" href="style.css?v=6.4.2">
</head>
<body data-mode="title">
  <div class="view-effects" aria-hidden="true"></div>
  <div id="rotate-screen" class="screen overlay" role="status">
    <div class="panel">
      <p class="eyebrow">スマホでの操作</p>
      <h1>スマホを横にしてください</h1>
      <p id="rotate-hint">横にすると捜索を始められます。</p>
    </div>
  </div>
  <main id="start-screen" class="screen title-screen">
    <div class="title-content">
      <h1>恐怖の森</h1>
      <p class="subtitle">こくにいVer.</p>
      <p class="mission">森に散らばったアケコンの部品を4個集め、<br class="wide-break">トンネル奥のPCでコマンドを入力して脱出する。<br>道路脇の標識や、廃車・井戸が捜索の目印。</p>
      <p id="start-error" role="alert" hidden></p>
      <button id="start-btn" class="btn start-action" type="button">捜索を始める <span aria-hidden="true">↗</span></button>
      <div class="controls" aria-label="操作方法">
        <p class="keyboard-controls"><kbd>WASD</kbd> 移動 <kbd>マウス</kbd> 視点 <kbd>Shift</kbd> ダッシュ <kbd>F</kbd> ライト <kbd>Esc</kbd> 一時停止</p>
        <p class="touch-controls"><span>左をドラッグ</span> 移動 <span>右をドラッグ</span> 視点</p>
      </div>
    </div>
    <small class="version">v6.4.2</small>
  </main>

  <section id="ui-top-left" aria-label="捜索状況">
    <div class="mission-display">
      <div id="objective" role="status">アケコン部品 0 / 4</div>
      <div id="hud-hint"></div>
    </div>
    <div class="meter-grid">
      <div class="meter"><div class="meter-label">電池 <span id="bat-value">100%</span></div><div class="meter-track"><div class="meter-fill" id="bat-lv"></div></div></div>
      <div class="meter"><div class="meter-label">体力 <span id="sta-value">100%</span></div><div class="meter-track"><div class="meter-fill" id="sta-lv"></div></div></div>
    </div>
  </section>
  <div id="warning-text" role="status"></div>
  <div id="pickup-notice" role="status"></div>
  <div id="crosshair" aria-hidden="true"></div>
  <button id="pause-btn" class="btn icon-btn" type="button" aria-label="一時停止">Ⅱ</button>
  <div id="view-cue"></div>
  <div id="pause-screen" class="screen overlay">
    <div class="panel"><h1>一時停止</h1>
      <button id="resume-btn" class="btn start-action" type="button">再開する <span aria-hidden="true">↗</span></button>
      <button id="sound-btn" class="btn secondary" type="button" aria-pressed="false">音声 ON</button>
      <button id="hint-btn" class="btn secondary" type="button" aria-pressed="false">方角の案内 OFF</button>
    </div>
  </div>
  <button id="light-btn" class="btn game-btn" type="button">ライト ON</button>
  <button id="dash-btn" class="btn game-btn" type="button">走る</button>

  <section id="arcade-screen" class="screen" aria-labelledby="arcade-title" hidden>
    <div class="arcade-panel">
      <div class="arcade-copy">
        <p class="eyebrow">トンネル端末 <span id="arcade-steps"></span></p>
        <h1 id="arcade-title" tabindex="-1">入力試験</h1>
        <h2 id="arcade-command"></h2>
        <p id="arcade-sequence"></p>
        <p id="arcade-history"></p>
        <p id="arcade-status" role="status"></p>
        <p class="arcade-keyboard">矢印キー／WASD（斜めは同時押し）・J＝P</p>
      </div>
      <div class="arcade-controls">
        <div id="arcade-pad" aria-label="方向入力">
          <button type="button" aria-label="左上" data-direction="7">↖</button><button type="button" aria-label="上" data-direction="8">↑</button><button type="button" aria-label="右上" data-direction="9">↗</button>
          <button type="button" aria-label="左" data-direction="4">←</button><span aria-hidden="true">·</span><button type="button" aria-label="右" data-direction="6">→</button>
          <button type="button" aria-label="左下" data-direction="1">↙</button><button type="button" aria-label="下" data-direction="2">↓</button><button type="button" aria-label="右下" data-direction="3">↘</button>
        </div>
        <button id="arcade-punch" class="btn" type="button" aria-label="パンチ P">P</button>
      </div>
    </div>
  </section>

  <div id="game-over" class="screen overlay">
    <div class="panel"><p class="eyebrow">捜索終了</p><h1 id="death-reason">捕まった…</h1><p id="death-stats" class="result-stats"></p>
      <button class="btn start-action" type="button" onclick="location.reload()">再プレイ <span aria-hidden="true">↗</span></button>
    </div>
  </div>
  <div id="game-clear" class="screen overlay">
    <div class="panel"><p class="eyebrow">捜索完了</p><h1>脱出成功！</h1><p id="clear-stats" class="result-stats"></p>
      <button class="btn start-action" type="button" onclick="location.reload()">タイトルへ <span aria-hidden="true">↗</span></button>
    </div>
  </div>

  <script src="vendor/three-r128.min.js"></script>
  <script src="forest.js?v=6.4.2"></script>
  <script src="chase-audio.js?v=6.4.2"></script>
  <script src="props.js?v=6.4.2"></script>
  <script src="structures.js?v=6.4.2"></script>
  <script src="footsteps.js?v=6.4.2"></script>
  <script src="pursuit.js?v=6.4.2"></script>
  <script src="arcade.js?v=6.4.2"></script>
  <script src="game.js?v=6.4.2"></script>
</body>
</html>
