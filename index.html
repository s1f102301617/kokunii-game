<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- 🚫 キャッシュ無効化 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iPhone全画面アプリ設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="こくにいゲーム">
  
  <title>恐怖の森 - こくにいVer.</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
    
    /* 縦画面時の警告カバー（スマホ用） */
    #rotate-notice {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0a0a0c; color: #fff;
      z-index: 200;
      flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 20px; box-sizing: border-box;
    }
    @media (orientation: portrait) and (max-width: 768px) {
      #rotate-notice { display: flex; }
    }

    /* スタート画面 */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.95); color: #fff;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; text-align: center;
    }
    #start-screen h1 { font-size: 2rem; color: #ff3333; margin: 0 0 10px; text-shadow: 0 0 10px #ff0000; }
    #start-btn {
      font-size: 1.3rem; padding: 16px 36px; background: #ff3333; color: #fff;
      border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 51, 51, 0.5); margin-top: 15px;
    }

    /* UI要素 */
    #ui { position: absolute; top: 15px; left: 15px; color: #fff; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; display: none; }
    #battery-ui { margin-top: 4px; font-weight: bold; color: #ffff00; font-size: 0.95rem; }
    #stamina-ui { margin-top: 2px; font-weight: bold; color: #00ffff; font-size: 0.95rem; }
    #parts-ui { margin-top: 2px; font-weight: bold; color: #00ff66; font-size: 1.05rem; text-shadow: 0 0 8px #00ff66; }

    /* 操作ボタン */
    .game-btn {
      position: absolute; z-index: 50; border: none; border-radius: 30px;
      font-weight: bold; cursor: pointer; display: none;
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    #light-btn { top: 15px; right: 15px; padding: 10px 18px; font-size: 0.9rem; background: rgba(255,255,255,0.85); color: #000; }
    #dash-btn { bottom: 25px; right: 25px; padding: 16px 28px; font-size: 1.1rem; background: rgba(255, 140, 0, 0.85); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

    /* ゲームオーバー画面 */
    #game-over { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(180, 0, 0, 0.95); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 150; text-align: center; }
    #game-over h1 { font-size: 2.2rem; margin-bottom: 10px; }
    
    /* ゲームクリア画面 */
    #game-clear { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 100, 180, 0.95); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 150; text-align: center; }
    #game-clear h1 { font-size: 2.5rem; color: #00ffff; text-shadow: 0 0 15px #00ffff; margin-bottom: 10px; }

    .retry-btn { font-size: 1.2rem; padding: 14px 28px; background: #fff; color: #000; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); margin-top: 15px; }
  </style>
</head>
<body>

  <!-- 縦画面時案内（スマホ用） -->
  <div id="rotate-notice">
    <div style="font-size: 3.5rem; margin-bottom: 15px;">📱↪️</div>
    <h2 style="margin: 0 0 10px;">画面を横向きにしてください</h2>
    <p style="font-size: 0.85rem; opacity: 0.8; margin: 0;">※スマホの「画面回転ロック」を解除して<br>横に持ってプレイしてください</p>
  </div>

  <!-- スタート画面 -->
  <div id="start-screen">
    <h1>恐怖の森 - こくにい避難指示</h1>
    <p style="margin: 0 0 8px; font-size: 0.9rem; opacity: 0.8;">※音が出ます。</p>
    <p style="margin: 0 0 15px; font-size: 0.8rem; opacity: 0.6; line-height: 1.4;">
      【PC操作】WASD: 移動 / マウス: 視点 / Shift: 走る / F: ライト<br>
      【スマホ操作】左画面ドラッグ: 移動 / 右画面ドラッグ: 視点
    </p>
    <button id="start-btn">🎮 ゲームスタート</button>
  </div>

  <!-- ゲームプレイ中UI -->
  <div id="ui">
    <h2 style="margin:0; font-size:1.1rem;">こくにいから逃げろ！</h2>
    <div id="parts-ui">💻 PCパーツ: <span id="parts-val">0</span> / 4</div>
    <div id="battery-ui">⚡ バッテリー: <span id="battery-val">100</span>%</div>
    <div id="stamina-ui">🏃 スタミナ: <span id="stamina-val">100</span>%</div>
    <div id="warning-text" style="color:#ff3333; font-weight:bold; margin-top:5px; display:none; font-size:0.85rem;"></div>
  </div>

  <button id="light-btn" class="game-btn">ライト ON</button>
  <button id="dash-btn" class="game-btn">🏃 走る</button>

  <!-- ゲームオーバー画面 -->
  <div id="game-over">
    <h1 id="death-reason">捕まった...</h1>
    <button id="retry-btn" class="retry-btn">もう一度プレイ</button>
  </div>

  <!-- ゲームクリア画面 -->
  <div id="game-clear">
    <h1>脱出成功！</h1>
    <p style="font-size:1.1rem;">PCの起動に成功し、無事に森から脱出できた！</p>
    <button id="clear-retry-btn" class="retry-btn">タイトルへ戻る</button>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const bgm = new Audio('bgm.mp3');
    bgm.loop = true;
    const jumpScareVoice = new Audio('voice.mp3');

    // 🔊 音声解除処理
    let audioCtx = null;
    let bgmGainNode = null;
    let bgmSourceNode = null;

    function unlockAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        bgmGainNode = audioCtx.createGain();
        bgmGainNode.gain.value = 0;
        bgmSourceNode = audioCtx.createMediaElementSource(bgm);
        bgmSourceNode.connect(bgmGainNode);
        bgmGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      bgm.play().then(() => {
        bgm.pause();
        bgm.currentTime = 0;
      }).catch(e => console.log(e));

      jumpScareVoice.play().then(() => {
        jumpScareVoice.pause();
        jumpScareVoice.currentTime = 0;
      }).catch(e => console.log(e));
    }

    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const clearRetryBtn = document.getElementById('clear-retry-btn');
    const lightBtn = document.getElementById('light-btn');
    const dashBtn = document.getElementById('dash-btn');
    const batteryValEl = document.getElementById('battery-val');
    const staminaValEl = document.getElementById('stamina-val');
    const partsValEl = document.getElementById('parts-val');
    const warningText = document.getElementById('warning-text');

    let isGameStarted = false;
    let isGameOver = false;
    let isGameClear = false;
    let isLightOn = true;
    let isDashing = false;
    let battery = 100;
    let stamina = 100;
    let collectedParts = 0;
    const totalParts = 4;
    let noBatteryTime = 0;

    // 💻 PC用キーボード状態管理
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyF') {
        if (battery > 0 && isGameStarted && !isGameOver && !isGameClear) {
          setLightState(!isLightOn);
        }
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // 動的テクスチャ
    function createGrassTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1e3318'; ctx.fillRect(0,0,256,256);
      for(let i=0; i<3000; i++) {
        ctx.fillStyle = Math.random() > 0.5 ? '#142410' : '#284520';
        ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(20, 20);
      return tex;
    }

    function createRoadTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 128; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#222225'; ctx.fillRect(0,0,128,256);
      ctx.fillStyle = '#e0e0e0';
      ctx.fillRect(60, 20, 8, 80);
      ctx.fillRect(60, 150, 8, 80);
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 15);
      return tex;
    }

    // 3D空間構築
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.04);

    const camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // 💻 PC用マウスクリック視点ロック
    renderer.domElement.addEventListener('click', () => {
      if (isGameStarted && !isGameOver && !isGameClear && !('ontouchstart' in window)) {
        renderer.domElement.requestPointerLock();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === renderer.domElement) {
        cameraRotation.yaw -= e.movementX * 0.0025;
        cameraRotation.pitch = Math.max(-1.2, Math.min(1.2, cameraRotation.pitch - e.movementY * 0.0025));
      }
    });

    // ライティング
    const ambientLight = new THREE.AmbientLight(0x222230, 0.2);
    scene.add(ambientLight);

    const flashLight = new THREE.SpotLight(0xfffae6, 22, 55, Math.PI / 3, 0.5, 1);
    camera.add(flashLight);
    flashLight.target.position.set(0, 0, -5);
    camera.add(flashLight.target);

    const localLight = new THREE.PointLight(0xfffae6, 0.3, 6);
    camera.add(localLight);
    scene.add(camera);

    function setLightState(on) {
      isLightOn = on;
      flashLight.visible = on;
      localLight.visible = on;
      ambientLight.intensity = on ? 0.2 : 0.02;
      lightBtn.innerText = on ? 'ライト ON' : 'ライト OFF';
    }

    function toggleLight(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (battery > 0 && isGameStarted && !isGameOver && !isGameClear) {
        setLightState(!isLightOn);
      }
    }
    lightBtn.addEventListener('touchstart', toggleLight, { passive: false });
    lightBtn.addEventListener('mousedown', toggleLight);

    function startDash(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (isGameStarted && !isGameOver && !isGameClear && stamina > 0) isDashing = true;
    }
    function stopDash(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      isDashing = false;
    }

    dashBtn.addEventListener('touchstart', startDash, { passive: false });
    dashBtn.addEventListener('touchend', stopDash, { passive: false });
    dashBtn.addEventListener('touchcancel', stopDash, { passive: false });
    dashBtn.addEventListener('mousedown', startDash);
    dashBtn.addEventListener('mouseup', stopDash);

    startBtn.addEventListener('click', () => { unlockAudio(); initAndStartGame(); });
    retryBtn.addEventListener('click', () => { unlockAudio(); initAndStartGame(); });
    clearRetryBtn.addEventListener('click', () => { unlockAudio(); initAndStartGame(); });

    // 地面 (150x150)
    const groundMat = new THREE.MeshStandardMaterial({ map: createGrassTexture(), roughness: 0.95 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(150, 150), groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 公道
    const roadMat = new THREE.MeshStandardMaterial({ map: createRoadTexture(), roughness: 0.8 });
    const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 150), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.02;
    scene.add(road);

    // トンネル
    const tunnelGroup = new THREE.Group();
    tunnelGroup.position.set(0, 0, -60);
    const tunnelMat = new THREE.MeshStandardMaterial({ color: 0x222228, roughness: 0.9 });
    const wallLeft = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 16), tunnelMat);
    wallLeft.position.set(-5, 3, 0);
    const wallRight = new THREE.Mesh(new THREE.BoxGeometry(2, 6, 16), tunnelMat);
    wallRight.position.set(5, 3, 0);
    const roof = new THREE.Mesh(new THREE.BoxGeometry(12, 2, 16), tunnelMat);
    roof.position.set(0, 6, 0);
    const backWall = new THREE.Mesh(new THREE.BoxGeometry(12, 8, 2), tunnelMat);
    backWall.position.set(0, 3, -8);
    tunnelGroup.add(wallLeft, wallRight, roof, backWall);
    scene.add(tunnelGroup);

    // PC
    const pcGroup = new THREE.Group();
    pcGroup.position.set(0, 0.5, -67);
    const deskMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 1), new THREE.MeshStandardMaterial({ color: 0x332211 }));
    const monitorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.1), new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x003344 }));
    monitorMesh.position.set(0, 0.8, 0);
    pcGroup.add(deskMesh, monitorMesh);
    scene.add(pcGroup);

    // 木の配置
    function createTree() {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.25, 0.4, 3, 6),
        new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.9 })
      );
      trunk.position.y = 1.5;
      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(2, 5, 6),
        new THREE.MeshStandardMaterial({ color: 0x0d220a, roughness: 0.8 })
      );
      leaves.position.y = 4.5;
      tree.add(trunk, leaves);
      return tree;
    }

    for (let i = 0; i < 100; i++) {
      const tree = createTree();
      let x = (Math.random() - 0.5) * 130;
      let z = (Math.random() - 0.5) * 130;
      if (Math.abs(x) < 7) x += (x >= 0 ? 8 : -8);
      tree.position.set(x, 0, z);
      if (tree.position.distanceTo(camera.position) > 6) scene.add(tree);
    }

    // バッテリー
    const batteries = [];
    const battGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.5, 8);
    const battMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x888800 });

    function spawnBattery() {
      const batt = new THREE.Mesh(battGeo, battMat);
      let x = (Math.random() - 0.5) * 110;
      let z = (Math.random() - 0.5) * 110;
      batt.position.set(x, 0.3, z);
      scene.add(batt);
      batteries.push(batt);
    }
    for (let i = 0; i < 8; i++) spawnBattery();

    // PCパーツ
    const pcParts = [];
    const partGeo = new THREE.BoxGeometry(0.5, 0.2, 0.4);
    const partMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00aa44, roughness: 0.2 });

    function spawnPCParts() {
      for (let i = 0; i < totalParts; i++) {
        const part = new THREE.Mesh(partGeo, partMat);
        let x = (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 45);
        let z = (Math.random() - 0.5) * 100;
        part.position.set(x, 0.3, z);
        scene.add(part);
        pcParts.push(part);
      }
    }

    // 敵（こくにい）
    const textureLoader = new THREE.TextureLoader();
    const enemyTexture = textureLoader.load('kokunii.jpg');
    const enemyMaterial = new THREE.SpriteMaterial({ map: enemyTexture });
    const enemy = new THREE.Sprite(enemyMaterial);
    enemy.scale.set(3.5, 3.5, 1);
    scene.add(enemy);

    let enemyState = 'PATROL';
    let patrolTarget = new THREE.Vector3();
    let enemyMoveDir = new THREE.Vector3(0, 0, 1);

    function getNewPatrolTarget() {
      patrolTarget.set((Math.random() - 0.5) * 110, 1.75, (Math.random() - 0.5) * 100);
    }

    let animationFrameId = null;
    let lastTime = 0;

    function initAndStartGame() {
      camera.position.set(0, 1.6, 25);
      cameraRotation = { yaw: 0, pitch: 0 };
      
      battery = 100;
      stamina = 100;
      collectedParts = 0;
      partsValEl.innerText = collectedParts;
      isDashing = false;
      setLightState(true);
      noBatteryTime = 0;
      
      pcParts.forEach(p => scene.remove(p));
      pcParts.length = 0;
      spawnPCParts();

      enemyState = 'PATROL';
      enemy.position.set(0, 1.75, -15);
      getNewPatrolTarget();

      isGameOver = false;
      isGameClear = false;
      isGameStarted = true;

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over').style.display = 'none';
      document.getElementById('game-clear').style.display = 'none';
      document.getElementById('ui').style.display = 'block';
      
      if ('ontouchstart' in window) {
        lightBtn.style.display = 'block';
        dashBtn.style.display = 'block';
      } else {
        lightBtn.style.display = 'none';
        dashBtn.style.display = 'none';
      }

      bgm.pause();
      bgm.currentTime = 0;
      if (bgmGainNode) bgmGainNode.gain.value = 0;

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      lastTime = performance.now();
      animate();
    }

    // タッチ操作制御
    let moveTouchId = null, lookTouchId = null;
    let moveStart = { x: 0, y: 0 }, lookStart = { x: 0, y: 0 };
    let moveDir = { forward: 0, side: 0 };
    let cameraRotation = { yaw: 0, pitch: 0 };

    window.addEventListener('touchstart', (e) => {
      if (!isGameStarted || isGameOver || isGameClear) return;
      for (let touch of e.changedTouches) {
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        if (targetEl && (targetEl.tagName === 'BUTTON' || targetEl.closest('button'))) continue;

        if (touch.clientX < window.innerWidth / 2 && moveTouchId === null) {
          moveTouchId = touch.identifier;
          moveStart = { x: touch.clientX, y: touch.clientY };
        } else if (touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
          lookTouchId = touch.identifier;
          lookStart = { x: touch.clientX, y: touch.clientY };
        }
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (!isGameStarted || isGameOver || isGameClear) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === moveTouchId) {
          moveDir.side = Math.min(Math.max((touch.clientX - moveStart.x) / 40, -1), 1);
          moveDir.forward = Math.min(Math.max(-(touch.clientY - moveStart.y) / 40, -1), 1);
        } else if (touch.identifier === lookTouchId) {
          cameraRotation.yaw -= (touch.clientX - lookStart.x) * 0.005;
          cameraRotation.pitch = Math.max(-1.2, Math.min(1.2, cameraRotation.pitch - (touch.clientY - lookStart.y) * 0.005));
          lookStart = { x: touch.clientX, y: touch.clientY };
        }
      }
    });

    const endTouch = (e) => {
      for (let touch of e.changedTouches) {
        if (touch.identifier === moveTouchId) { moveTouchId = null; moveDir = { forward: 0, side: 0 }; }
        if (touch.identifier === lookTouchId) { lookTouchId = null; }
      }
    };
    window.addEventListener('touchend', endTouch);
    window.addEventListener('touchcancel', endTouch);

    const normalSpeed = 0.07;
    const dashSpeed = 0.12;
    const chaseSpeed = 0.078;
    const patrolSpeed = 0.035;

    function animate() {
      if (!isGameStarted || isGameOver || isGameClear) return;
      animationFrameId = requestAnimationFrame(animate);

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // 💻 PCキーボード ＋ スマホタッチ操作統合
      let keyForward = 0;
      let keySide = 0;
      if (keys['KeyW'] || keys['ArrowUp']) keyForward += 1;
      if (keys['KeyS'] || keys['ArrowDown']) keyForward -= 1;
      if (keys['KeyA'] || keys['ArrowLeft']) keySide -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) keySide += 1;

      const totalForward = moveDir.forward || keyForward;
      const totalSide = moveDir.side || keySide;
      const totalDash = isDashing || keys['ShiftLeft'] || keys['ShiftRight'];

      // バッテリー消費
      if (isLightOn && battery > 0) {
        battery -= delta * 0.2;
        if (battery <= 0) {
          battery = 0;
          setLightState(false);
          lightBtn.innerText = 'ライト 0%';
        }
      }
      batteryValEl.innerText = Math.ceil(battery);

      // スタミナ＆ダッシュ制御
      const isMoving = (totalForward !== 0 || totalSide !== 0);
      let currentSpeed = normalSpeed;

      if (totalDash && stamina > 0 && isMoving) {
        currentSpeed = dashSpeed;
        stamina -= delta * 25;
        if (stamina <= 0) { stamina = 0; isDashing = false; }
      } else {
        if (stamina < 100) { stamina += delta * 15; if (stamina > 100) stamina = 100; }
      }
      staminaValEl.innerText = Math.ceil(stamina);

      // 暗闇ペナルティ（5秒で急襲）
      if (battery <= 0) {
        noBatteryTime += delta;
        warningText.style.display = 'block';
        warningText.innerText = `⚠️ 闇の中！残り ${(Math.max(0, 5 - noBatteryTime)).toFixed(1)}秒で急襲！`;

        if (noBatteryTime >= 5.0) {
          const frontDir = new THREE.Vector3(0, 0, -1.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.yaw);
          enemy.position.copy(camera.position).add(frontDir);
          enemy.position.y = 1.6;
          triggerGameOver("暗闇の中で捕まった...");
          return;
        }
      } else {
        noBatteryTime = 0;
        warningText.style.display = 'none';
      }

      // バッテリー回収
      for (let i = batteries.length - 1; i >= 0; i--) {
        const batt = batteries[i];
        batt.rotation.y += delta * 2;
        if (camera.position.distanceTo(batt.position) < 1.5) {
          battery = 100;
          setLightState(true);
          scene.remove(batt);
          batteries.splice(i, 1);
          spawnBattery();
        }
      }

      // PCパーツ回収
      for (let i = pcParts.length - 1; i >= 0; i--) {
        const part = pcParts[i];
        part.rotation.y += delta * 3;
        if (camera.position.distanceTo(part.position) < 1.8) {
          collectedParts++;
          partsValEl.innerText = collectedParts;
          scene.remove(part);
          pcParts.splice(i, 1);

          if (collectedParts >= totalParts) {
            warningText.style.display = 'block';
            warningText.style.color = '#00ffff';
            warningText.innerText = '⚡ パーツが揃った！トンネル奥のPCを起動しろ！';
          }
        }
      }

      // トンネルPCクリア判定
      if (collectedParts >= totalParts) {
        if (camera.position.distanceTo(pcGroup.position) < 2.5) {
          triggerGameClear();
          return;
        }
      }

      // プレイヤー移動計算
      camera.rotation.order = 'YXZ';
      camera.rotation.y = cameraRotation.yaw;
      camera.rotation.x = cameraRotation.pitch;

      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.yaw);
      const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.yaw);
      camera.position.addScaledVector(forward, totalForward * currentSpeed);
      camera.position.addScaledVector(side, totalSide * currentSpeed);

      // こくにいAI
      const vecToPlayer = new THREE.Vector3().subVectors(camera.position, enemy.position);
      vecToPlayer.y = 0;
      const distToPlayer = vecToPlayer.length();

      if (enemyState === 'PATROL') {
        if (distToPlayer < 18) {
          const angle = enemyMoveDir.angleTo(vecToPlayer.clone().normalize());
          if (angle < Math.PI / 3 || distToPlayer < 7) {
            enemyState = 'CHASE';
          }
        }
      } else if (enemyState === 'CHASE') {
        if (distToPlayer > 20) {
          enemyState = 'PATROL';
          getNewPatrolTarget();
        }
      }

      if (enemyState === 'CHASE') {
        const chaseDir = vecToPlayer.clone().normalize();
        enemy.position.addScaledVector(chaseDir, chaseSpeed);
        enemyMoveDir.copy(chaseDir);
      } else {
        const vecToTarget = new THREE.Vector3().subVectors(patrolTarget, enemy.position);
        vecToTarget.y = 0;
        if (vecToTarget.length() < 1.5) {
          getNewPatrolTarget();
        } else {
          const patrolDir = vecToTarget.normalize();
          enemy.position.addScaledVector(patrolDir, patrolSpeed);
          enemyMoveDir.copy(patrolDir);
        }
      }

      // 🔊 音量リアルタイム制御
      if (enemyState === 'CHASE' && distToPlayer < 18) {
        if (bgm.paused) {
          bgm.currentTime = 0;
          bgm.play().catch(e => console.log(e));
        }
        const ratio = Math.max(0, 1 - (distToPlayer / 18));
        const targetVolume = Math.pow(ratio, 1.2) * 0.8;
        if (bgmGainNode) bgmGainNode.gain.value = targetVolume;
      } else {
        if (!bgm.paused) {
          bgm.pause();
          bgm.currentTime = 0;
        }
        if (bgmGainNode) bgmGainNode.gain.value = 0;
      }

      // 当たり判定
      if (distToPlayer < 1.5) {
        triggerGameOver("こくにいに捕まった！");
      }

      renderer.render(scene, camera);
    }

    function triggerGameOver(reason) {
      isGameOver = true;
      if (document.exitPointerLock) document.exitPointerLock();
      bgm.pause();
      if (bgmGainNode) bgmGainNode.gain.value = 0;
      jumpScareVoice.play().catch(()=>{});
      document.getElementById('death-reason').innerText = reason;
      document.getElementById('game-over').style.display = 'flex';
      lightBtn.style.display = 'none';
      dashBtn.style.display = 'none';
    }

    function triggerGameClear() {
      isGameClear = true;
      if (document.exitPointerLock) document.exitPointerLock();
      bgm.pause();
      if (bgmGainNode) bgmGainNode.gain.value = 0;
      document.getElementById('game-clear').style.display = 'flex';
      lightBtn.style.display = 'none';
      dashBtn.style.display = 'none';
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
</html>
