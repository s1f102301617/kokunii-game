<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  
  <!-- 🚫 キャッシュ無効化 -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">

  <!-- iPhone全画面アプリ設定 -->
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="こくにいゲーム">
  
  <title>恐怖の森 - こくにいVer.</title>
  <style>
    body { margin: 0; overflow: hidden; background: #000; font-family: sans-serif; touch-action: none; -webkit-user-select: none; user-select: none; }
    
    /* 縦画面時の警告カバー（スマホ用） */
    #rotate-notice {
      display: none;
      position: absolute;
      top: 0; left: 0; width: 100vw; height: 100vh;
      background: #0a0a0c; color: #fff;
      z-index: 200;
      flex-direction: column; justify-content: center; align-items: center;
      text-align: center; padding: 20px; box-sizing: border-box;
    }
    @media (orientation: portrait) and (max-width: 768px) {
      #rotate-notice { display: flex; }
    }

    /* スタート画面 */
    #start-screen {
      position: absolute; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(0, 0, 0, 0.95); color: #fff;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      z-index: 100; text-align: center;
    }
    #start-screen h1 { font-size: 2rem; color: #ff3333; margin: 0 0 10px; text-shadow: 0 0 10px #ff0000; }
    .version-tag { font-size: 0.85rem; color: #888; font-weight: normal; margin-left: 6px; vertical-align: middle; }
    
    #start-btn {
      font-size: 1.3rem; padding: 16px 36px; background: #ff3333; color: #fff;
      border: none; border-radius: 30px; font-weight: bold; cursor: pointer;
      box-shadow: 0 4px 15px rgba(255, 51, 51, 0.5); margin-top: 15px;
    }
    #update-btn {
      margin-top: 15px; font-size: 0.85rem; padding: 8px 16px; background: #333; color: #aaa;
      border: 1px solid #555; border-radius: 15px; cursor: pointer;
    }

    /* UI要素 */
    #ui { position: absolute; top: 15px; left: 15px; color: #fff; text-shadow: 2px 2px 4px #000; pointer-events: none; z-index: 10; display: none; }
    #battery-ui { margin-top: 4px; font-weight: bold; color: #ffff00; font-size: 0.95rem; }
    #stamina-ui { margin-top: 2px; font-weight: bold; color: #00ffff; font-size: 0.95rem; }
    #parts-ui { margin-top: 2px; font-weight: bold; color: #00ff66; font-size: 1.05rem; text-shadow: 0 0 8px #00ff66; }

    /* 操作ボタン */
    .game-btn {
      position: absolute; z-index: 50; border: none; border-radius: 30px;
      font-weight: bold; cursor: pointer; display: none;
      user-select: none; -webkit-user-select: none; touch-action: manipulation;
    }
    #light-btn { top: 15px; right: 15px; padding: 10px 18px; font-size: 0.9rem; background: rgba(255,255,255,0.85); color: #000; }
    #dash-btn { bottom: 25px; right: 25px; padding: 16px 28px; font-size: 1.1rem; background: rgba(255, 140, 0, 0.85); color: #fff; box-shadow: 0 4px 10px rgba(0,0,0,0.5); }

    /* 結果画面ボタン */
    .btn-group { display: flex; gap: 12px; margin-top: 20px; flex-wrap: wrap; justify-content: center; }
    .action-btn { font-size: 1.1rem; padding: 12px 24px; border: none; border-radius: 25px; font-weight: bold; cursor: pointer; box-shadow: 0 4px 10px rgba(0,0,0,0.3); }
    .retry-btn { background: #ff3333; color: #fff; }
    .home-btn { background: #ffffff; color: #000; }

    /* ゲームオーバー・クリア画面 */
    #game-over { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(180, 0, 0, 0.95); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 150; text-align: center; }
    #game-over h1 { font-size: 2.2rem; margin-bottom: 10px; }
    
    #game-clear { display: none; position: absolute; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0, 100, 180, 0.95); color: white; flex-direction: column; justify-content: center; align-items: center; z-index: 150; text-align: center; }
    #game-clear h1 { font-size: 2.5rem; color: #00ffff; text-shadow: 0 0 15px #00ffff; margin-bottom: 10px; }
  </style>
</head>
<body>

  <!-- 縦画面時案内（スマホ用） -->
  <div id="rotate-notice">
    <div style="font-size: 3.5rem; margin-bottom: 15px;">📱↪️</div>
    <h2 style="margin: 0 0 10px;">画面を横向きにしてください</h2>
    <p style="font-size: 0.85rem; opacity: 0.8; margin: 0;">※スマホの「画面回転ロック」を解除して<br>横に持ってプレイしてください</p>
  </div>

  <!-- スタート画面 -->
  <div id="start-screen">
    <h1>恐怖の森 - こくにいVer.<span class="version-tag">v1.7.0</span></h1>
    <p style="margin: 0 0 8px; font-size: 0.9rem; opacity: 0.8;">※音が出ます。</p>
    <p style="margin: 0 0 15px; font-size: 0.8rem; opacity: 0.6; line-height: 1.4;">
      【PC操作】WASD: 移動 / マウス: 視点 / Shift: 走る / F: ライト<br>
      【スマホ操作】左画面ドラッグ: 移動 / 右画面ドラッグ: 視点
    </p>
    <button id="start-btn">🎮 ゲームスタート</button>
    <button id="update-btn">🔄 最新版にアップデート（更新）</button>
  </div>

  <!-- ゲームプレイ中UI -->
  <div id="ui">
    <h2 style="margin:0; font-size:1.1rem;">こくにいから逃げろ！</h2>
    <div id="parts-ui">💻 PCパーツ: <span id="parts-val">0</span> / 4</div>
    <div id="battery-ui">⚡ バッテリー: <span id="battery-val">100</span>%</div>
    <div id="stamina-ui">🏃 スタミナ: <span id="stamina-val">100</span>%</div>
    <div id="warning-text" style="color:#ff3333; font-weight:bold; margin-top:5px; display:none; font-size:0.85rem;"></div>
  </div>

  <button id="light-btn" class="game-btn">ライト ON</button>
  <button id="dash-btn" class="game-btn">🏃 走る</button>

  <!-- ゲームオーバー画面 -->
  <div id="game-over">
    <h1 id="death-reason">捕まった...</h1>
    <div class="btn-group">
      <button id="retry-btn" class="action-btn retry-btn">🎮 もう一度プレイ</button>
      <button id="home-btn-over" class="action-btn home-btn">🏠 タイトル画面へ</button>
    </div>
  </div>

  <!-- ゲームクリア画面 -->
  <div id="game-clear">
    <h1>脱出成功！</h1>
    <p style="font-size:1.1rem;">PCの起動に成功し、無事に森から脱出できた！</p>
    <div class="btn-group">
      <button id="clear-retry-btn" class="action-btn retry-btn">🎮 もう一度プレイ</button>
      <button id="home-btn-clear" class="action-btn home-btn">🏠 タイトル画面へ</button>
    </div>
  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const bgm = new Audio('bgm.mp3');
    bgm.loop = true;
    const jumpScareVoice = new Audio('voice.mp3');

    // 🔄 アップデートボタン処理
    document.getElementById('update-btn').addEventListener('click', () => {
      const now = new Date().getTime();
      window.location.href = window.location.pathname + '?v=' + now;
    });

    // 🔊 音声解除処理
    let audioCtx = null;
    let bgmGainNode = null;
    let bgmSourceNode = null;

    function unlockAudio() {
      if (!audioCtx) {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        audioCtx = new AudioContext();
        bgmGainNode = audioCtx.createGain();
        bgmGainNode.gain.value = 0;
        bgmSourceNode = audioCtx.createMediaElementSource(bgm);
        bgmSourceNode.connect(bgmGainNode);
        bgmGainNode.connect(audioCtx.destination);
      }
      if (audioCtx.state === 'suspended') {
        audioCtx.resume();
      }

      bgm.play().then(() => {
        bgm.pause();
        bgm.currentTime = 0;
      }).catch(e => console.log(e));

      jumpScareVoice.play().then(() => {
        jumpScareVoice.pause();
        jumpScareVoice.currentTime = 0;
      }).catch(e => console.log(e));
    }

    const startBtn = document.getElementById('start-btn');
    const retryBtn = document.getElementById('retry-btn');
    const homeBtnOver = document.getElementById('home-btn-over');
    const clearRetryBtn = document.getElementById('clear-retry-btn');
    const homeBtnClear = document.getElementById('home-btn-clear');
    const lightBtn = document.getElementById('light-btn');
    const dashBtn = document.getElementById('dash-btn');
    const batteryValEl = document.getElementById('battery-val');
    const staminaValEl = document.getElementById('stamina-val');
    const partsValEl = document.getElementById('parts-val');
    const warningText = document.getElementById('warning-text');

    let isGameStarted = false;
    let isGameOver = false;
    let isGameClear = false;
    let isLightOn = true;
    let isDashing = false;
    let battery = 100;
    let stamina = 100;
    let collectedParts = 0;
    const totalParts = 4;
    let noBatteryTime = 0;

    // キーボード状態管理
    const keys = {};
    window.addEventListener('keydown', (e) => {
      keys[e.code] = true;
      if (e.code === 'KeyF') {
        if (battery > 0 && isGameStarted && !isGameOver && !isGameClear) {
          setLightState(!isLightOn);
        }
      }
    });
    window.addEventListener('keyup', (e) => {
      keys[e.code] = false;
    });

    // 🎨 テクスチャ動的生成
    function createGrassTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#0f170b'; ctx.fillRect(0,0,512,512);
      
      for(let i=0; i<15000; i++) {
        const rand = Math.random();
        ctx.fillStyle = rand > 0.6 ? '#090d07' : (rand > 0.2 ? '#172412' : '#221e14');
        ctx.fillRect(Math.random()*512, Math.random()*512, 2, 3);
      }
      for(let i=0; i<40; i++) {
        ctx.fillStyle = 'rgba(5, 5, 5, 0.45)';
        ctx.beginPath();
        ctx.arc(Math.random()*512, Math.random()*512, 10 + Math.random()*35, 0, Math.PI*2);
        ctx.fill();
      }

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(15, 15);
      return tex;
    }

    function createRoadTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 512;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1a1a1d'; ctx.fillRect(0,0,256,512);
      
      for(let i=0; i<8000; i++) {
        const v = Math.floor(Math.random() * 30);
        ctx.fillStyle = `rgba(${v},${v},${v},0.2)`;
        ctx.fillRect(Math.random()*256, Math.random()*512, 2, 2);
      }
      
      ctx.strokeStyle = '#0a0a0c'; ctx.lineWidth = 2;
      for(let i=0; i<15; i++) {
        ctx.beginPath();
        let cx = Math.random()*256, cy = Math.random()*512;
        ctx.moveTo(cx, cy);
        for(let j=0; j<5; j++) {
          cx += (Math.random()-0.5)*30; cy += (Math.random()-0.5)*30;
          ctx.lineTo(cx, cy);
        }
        ctx.stroke();
      }

      ctx.fillStyle = 'rgba(180, 180, 180, 0.4)';
      ctx.fillRect(122, 40, 12, 160);
      ctx.fillRect(122, 300, 12, 160);

      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 10);
      return tex;
    }

    function createConcreteTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 256; canvas.height = 256;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#1a1a1e'; ctx.fillRect(0,0,256,256);
      for(let i=0; i<8000; i++) {
        const v = Math.floor(Math.random() * 25);
        ctx.fillStyle = `rgba(${v},${v},${v},0.2)`;
        ctx.fillRect(Math.random()*256, Math.random()*256, 2, 2);
      }
      const tex = new THREE.CanvasTexture(canvas);
      tex.wrapS = THREE.RepeatWrapping; tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(2, 6);
      return tex;
    }

    function createWarningTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512; canvas.height = 128;
      const ctx = canvas.getContext('2d');
      ctx.fillStyle = '#222225'; ctx.fillRect(0,0,512,128);
      const stripeW = 32;
      ctx.fillStyle = '#b8860b';
      for (let i = -512; i < 1024; i += stripeW * 2) {
        ctx.beginPath(); ctx.moveTo(i, 0); ctx.lineTo(i + stripeW, 0);
        ctx.lineTo(i + stripeW - 64, 128); ctx.lineTo(i - 64, 128);
        ctx.closePath(); ctx.fill();
      }
      const tex = new THREE.CanvasTexture(canvas);
      return tex;
    }

    // 3D空間構築
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x050508, 0.04);

    const camera = new THREE.PerspectiveCamera(90, window.innerWidth / window.innerHeight, 0.1, 1000);
    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    document.body.appendChild(renderer.domElement);

    // PC用マウスクリック視点ロック
    renderer.domElement.addEventListener('click', () => {
      if (isGameStarted && !isGameOver && !isGameClear && !('ontouchstart' in window)) {
        renderer.domElement.requestPointerLock();
      }
    });

    document.addEventListener('mousemove', (e) => {
      if (document.pointerLockElement === renderer.domElement) {
        cameraRotation.yaw -= e.movementX * 0.0025;
        cameraRotation.pitch = Math.max(-1.2, Math.min(1.2, cameraRotation.pitch - e.movementY * 0.0025));
      }
    });

    // ライティング
    const ambientLight = new THREE.AmbientLight(0x222230, 0.15);
    scene.add(ambientLight);

    const flashLight = new THREE.SpotLight(0xfffae6, 18, 55, Math.PI / 3, 0.6, 1.8);
    camera.add(flashLight);
    flashLight.target.position.set(0, 0, -5);
    camera.add(flashLight.target);

    const localLight = new THREE.PointLight(0xfffae6, 0.15, 5);
    camera.add(localLight);
    scene.add(camera);

    function setLightState(on) {
      isLightOn = on;
      flashLight.visible = on;
      localLight.visible = on;
      ambientLight.intensity = on ? 0.15 : 0.02;
      lightBtn.innerText = on ? 'ライト ON' : 'ライト OFF';
    }

    function toggleLight(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (battery > 0 && isGameStarted && !isGameOver && !isGameClear) {
        setLightState(!isLightOn);
      }
    }
    lightBtn.addEventListener('touchstart', toggleLight, { passive: false });
    lightBtn.addEventListener('mousedown', toggleLight);

    function startDash(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      if (isGameStarted && !isGameOver && !isGameClear && stamina > 0) isDashing = true;
    }
    function stopDash(e) {
      if (e) { e.preventDefault(); e.stopPropagation(); }
      isDashing = false;
    }

    dashBtn.addEventListener('touchstart', startDash, { passive: false });
    dashBtn.addEventListener('touchend', stopDash, { passive: false });
    dashBtn.addEventListener('touchcancel', stopDash, { passive: false });
    dashBtn.addEventListener('mousedown', startDash);
    dashBtn.addEventListener('mouseup', stopDash);

    startBtn.addEventListener('click', () => { unlockAudio(); initAndStartGame(); });
    retryBtn.addEventListener('click', () => { unlockAudio(); initAndStartGame(); });
    clearRetryBtn.addEventListener('click', () => { unlockAudio(); initAndStartGame(); });

    function goToHome() {
      isGameStarted = false;
      isGameOver = false;
      isGameClear = false;
      bgm.pause();
      if (bgmGainNode) bgmGainNode.gain.value = 0;
      if (document.exitPointerLock) document.exitPointerLock();

      document.getElementById('game-over').style.display = 'none';
      document.getElementById('game-clear').style.display = 'none';
      document.getElementById('ui').style.display = 'none';
      lightBtn.style.display = 'none';
      dashBtn.style.display = 'none';
      document.getElementById('start-screen').style.display = 'flex';
    }

    homeBtnOver.addEventListener('click', goToHome);
    homeBtnClear.addEventListener('click', goToHome);

    // 地面
    const groundMat = new THREE.MeshStandardMaterial({ map: createGrassTexture(), roughness: 0.95 });
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(150, 150), groundMat);
    ground.rotation.x = -Math.PI / 2;
    scene.add(ground);

    // 公道
    const roadMat = new THREE.MeshStandardMaterial({ map: createRoadTexture(), roughness: 0.9, metalness: 0.0 });
    const road = new THREE.Mesh(new THREE.PlaneGeometry(10, 150), roadMat);
    road.rotation.x = -Math.PI / 2;
    road.position.y = 0.02;
    scene.add(road);

    // 🚧 通行止めバリケード
    const barricadeGroup = new THREE.Group();
    barricadeGroup.position.set(0, 0, 65);
    const fenceMat = new THREE.MeshStandardMaterial({ color: 0x992222, roughness: 0.7 });
    const poleMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.8 });
    const fenceBoard = new THREE.Mesh(new THREE.BoxGeometry(10, 1.2, 0.2), fenceMat);
    fenceBoard.position.set(0, 1.2, 0);
    const pole1 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.2), poleMat);
    pole1.position.set(-4.5, 1.1, 0);
    const pole2 = new THREE.Mesh(new THREE.CylinderGeometry(0.1, 0.1, 2.2), poleMat);
    pole2.position.set(4.5, 1.1, 0);
    barricadeGroup.add(fenceBoard, pole1, pole2);
    scene.add(barricadeGroup);

    // 🚧 壊れたガードレール配置
    const guardRailMat = new THREE.MeshStandardMaterial({ color: 0x888888, metalness: 0.5, roughness: 0.6 });
    const rustMat = new THREE.MeshStandardMaterial({ color: 0x5a2d18, roughness: 0.9 });

    const guardGaps = [
      { minZ: 0, maxZ: 18 },
      { minZ: -35, maxZ: -20 }
    ];

    function isInsideGap(z) {
      return guardGaps.some(g => z >= g.minZ && z <= g.maxZ);
    }

    for (let z = -50; z <= 60; z += 6) {
      if (isInsideGap(z)) {
        if (Math.random() > 0.3) {
          const brokenRail = new THREE.Mesh(new THREE.BoxGeometry(0.2, 0.5, 4.5), rustMat);
          const xSide = Math.random() > 0.5 ? 5.3 : -5.3;
          brokenRail.position.set(xSide, 0.2, z);
          brokenRail.rotation.z = (Math.random() - 0.5) * 1.2;
          brokenRail.rotation.y = (Math.random() - 0.5) * 0.8;
          scene.add(brokenRail);
        }
        continue;
      }

      const railL = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 5.8), guardRailMat);
      railL.position.set(-5.2, 0.8, z);
      scene.add(railL);

      const railR = new THREE.Mesh(new THREE.BoxGeometry(0.15, 0.5, 5.8), guardRailMat);
      railR.position.set(5.2, 0.8, z);
      scene.add(railR);
    }

    // ⛰️ 山肌（トンネルの開口部に完全に合わせたサイズ・位置に再構築）
    const cliffMat = new THREE.MeshStandardMaterial({ color: 0x0f180d, roughness: 1.0 });
    const mountainWall = new THREE.Mesh(new THREE.BoxGeometry(160, 40, 20), cliffMat);
    mountainWall.position.set(0, 18, -68);
    scene.add(mountainWall);

    // 🚇 完全にくり抜かれたトンネル構造 (Z = -50 から Z = -85)
    const concreteTex = createConcreteTexture();
    const concreteMat = new THREE.MeshStandardMaterial({ map: concreteTex, roughness: 0.9, side: THREE.DoubleSide });
    const warningTex = createWarningTexture();
    const warningMat = new THREE.MeshStandardMaterial({ map: warningTex, roughness: 0.8 });

    // トンネル内部（幅10, 高さ7）
    const tunnelGeo = new THREE.BoxGeometry(10, 7, 35);
    const tunnelInsideMat = new THREE.MeshStandardMaterial({ 
      map: concreteTex, 
      roughness: 0.95, 
      side: THREE.BackSide 
    });
    const tunnelMesh = new THREE.Mesh(tunnelGeo, tunnelInsideMat);
    tunnelMesh.position.set(0, 3.5, -67.5);
    scene.add(tunnelMesh);

    // 入口ポータル枠（幅10, 高さ7の開口部にぴったりのサイズ）
    const portalGroup = new THREE.Group();
    portalGroup.position.set(0, 0, -50);

    const portalTop = new THREE.Mesh(new THREE.BoxGeometry(12, 1.5, 1.5), warningMat);
    portalTop.position.set(0, 6.25, 0);
    const portalL = new THREE.Mesh(new THREE.BoxGeometry(1, 7, 1.5), concreteMat);
    portalL.position.set(-5.5, 3.5, 0);
    const portalR = new THREE.Mesh(new THREE.BoxGeometry(1, 7, 1.5), concreteMat);
    portalR.position.set(5.5, 3.5, 0);

    portalGroup.add(portalTop, portalL, portalR);
    scene.add(portalGroup);

    // 🚨 非常灯
    for (let zPos of [-58, -68, -78]) {
      const lampMesh = new THREE.Mesh(
        new THREE.BoxGeometry(0.3, 0.4, 0.2),
        new THREE.MeshBasicMaterial({ color: 0xff6600 })
      );
      lampMesh.position.set(-4.8, 4.5, zPos);
      scene.add(lampMesh);

      const lampLight = new THREE.PointLight(0xff6600, 1.5, 12);
      lampLight.position.set(-4.3, 4.5, zPos);
      scene.add(lampLight);
    }

    // PC（トンネル最奥部 Z = -84）
    const pcGroup = new THREE.Group();
    pcGroup.position.set(0, 0.5, -84);
    const deskMesh = new THREE.Mesh(new THREE.BoxGeometry(2, 1, 1), new THREE.MeshStandardMaterial({ color: 0x22150a, roughness: 0.9 }));
    const monitorMesh = new THREE.Mesh(new THREE.BoxGeometry(0.8, 0.6, 0.1), new THREE.MeshStandardMaterial({ color: 0x111111, emissive: 0x002233 }));
    monitorMesh.position.set(0, 0.8, 0);
    pcGroup.add(deskMesh, monitorMesh);
    scene.add(pcGroup);

    // 🌲 木の生成 ＋ 衝突用データ保存
    const treeColliders = [];

    function createTree() {
      const tree = new THREE.Group();
      const trunk = new THREE.Mesh(
        new THREE.CylinderGeometry(0.3, 0.5, 3.5, 6),
        new THREE.MeshStandardMaterial({ color: 0x2a1a0a, roughness: 0.9 })
      );
      trunk.position.y = 1.75;
      const leaves = new THREE.Mesh(
        new THREE.ConeGeometry(2.2, 5.5, 6),
        new THREE.MeshStandardMaterial({ color: 0x0d220a, roughness: 0.8 })
      );
      leaves.position.y = 4.8;
      tree.add(trunk, leaves);
      return tree;
    }

    for (let i = 0; i < 80; i++) {
      const tree = createTree();
      let x = (Math.random() - 0.5) * 120;
      let z = (Math.random() - 0.5) * 110;
      if (Math.abs(x) < 7) x += (x >= 0 ? 8 : -8);
      tree.position.set(x, 0, z);
      if (tree.position.distanceTo(camera.position) > 6) {
        scene.add(tree);
        treeColliders.push({ x: x, z: z, radius: 0.7 });
      }
    }

    for (let i = 0; i < 160; i++) {
      const tree = createTree();
      tree.scale.set(1.2, 1.3, 1.2);
      let side = Math.floor(Math.random() * 3);
      let x, z;
      if (side === 0) { x = 68 + Math.random() * 8; z = (Math.random() - 0.5) * 140; }
      else if (side === 1) { x = -68 - Math.random() * 8; z = (Math.random() - 0.5) * 140; }
      else { x = (Math.random() - 0.5) * 150; z = 68 + Math.random() * 8; }
      tree.position.set(x, 0, z);
      scene.add(tree);
      treeColliders.push({ x: x, z: z, radius: 0.9 });
    }

    // バッテリー
    const batteries = [];
    const battGeo = new THREE.CylinderGeometry(0.2, 0.2, 0.5, 8);
    const battMat = new THREE.MeshStandardMaterial({ color: 0xffff00, emissive: 0x888800 });

    function spawnBattery() {
      const batt = new THREE.Mesh(battGeo, battMat);
      let x = (Math.random() - 0.5) * 110;
      let z = (Math.random() - 0.5) * 100;
      batt.position.set(x, 0.3, z);
      scene.add(batt);
      batteries.push(batt);
    }
    for (let i = 0; i < 8; i++) spawnBattery();

    // PCパーツ
    const pcParts = [];
    const partGeo = new THREE.BoxGeometry(0.5, 0.2, 0.4);
    const partMat = new THREE.MeshStandardMaterial({ color: 0x00ff66, emissive: 0x00aa44, roughness: 0.2 });

    function spawnPCParts() {
      for (let i = 0; i < totalParts; i++) {
        const part = new THREE.Mesh(partGeo, partMat);
        let x = (Math.random() > 0.5 ? 1 : -1) * (10 + Math.random() * 45);
        let z = (Math.random() - 0.5) * 85;
        part.position.set(x, 0.3, z);
        scene.add(part);
        pcParts.push(part);
      }
    }

    // 👾 敵（こくにい）
    const textureLoader = new THREE.TextureLoader();
    const enemyTexture = textureLoader.load('kokunii.PNG');
    const enemyMaterial = new THREE.SpriteMaterial({ map: enemyTexture, transparent: true });
    const enemy = new THREE.Sprite(enemyMaterial);
    enemy.scale.set(3.5, 3.5, 1);
    scene.add(enemy);

    let enemyState = 'PATROL';
    let patrolTarget = new THREE.Vector3();
    let enemyMoveDir = new THREE.Vector3(0, 0, 1);

    function getNewPatrolTarget() {
      patrolTarget.set((Math.random() - 0.5) * 110, 1.75, (Math.random() - 0.5) * 90);
    }

    let animationFrameId = null;
    let lastTime = 0;

    function initAndStartGame() {
      camera.position.set(0, 1.6, 25);
      cameraRotation = { yaw: 0, pitch: 0 };
      
      battery = 100;
      stamina = 100;
      collectedParts = 0;
      partsValEl.innerText = collectedParts;
      isDashing = false;
      setLightState(true);
      noBatteryTime = 0;
      
      pcParts.forEach(p => scene.remove(p));
      pcParts.length = 0;
      spawnPCParts();

      enemyState = 'PATROL';
      enemy.position.set(0, 1.75, -10);
      getNewPatrolTarget();

      isGameOver = false;
      isGameClear = false;
      isGameStarted = true;

      document.getElementById('start-screen').style.display = 'none';
      document.getElementById('game-over').style.display = 'none';
      document.getElementById('game-clear').style.display = 'none';
      document.getElementById('ui').style.display = 'block';
      
      if ('ontouchstart' in window) {
        lightBtn.style.display = 'block';
        dashBtn.style.display = 'block';
      } else {
        lightBtn.style.display = 'none';
        dashBtn.style.display = 'none';
      }

      bgm.pause();
      bgm.currentTime = 0;
      if (bgmGainNode) bgmGainNode.gain.value = 0;

      if (animationFrameId) cancelAnimationFrame(animationFrameId);
      lastTime = performance.now();
      animate();
    }

    // タッチ操作制御
    let moveTouchId = null, lookTouchId = null;
    let moveStart = { x: 0, y: 0 }, lookStart = { x: 0, y: 0 };
    let moveDir = { forward: 0, side: 0 };
    let cameraRotation = { yaw: 0, pitch: 0 };

    window.addEventListener('touchstart', (e) => {
      if (!isGameStarted || isGameOver || isGameClear) return;
      for (let touch of e.changedTouches) {
        const targetEl = document.elementFromPoint(touch.clientX, touch.clientY);
        if (targetEl && (targetEl.tagName === 'BUTTON' || targetEl.closest('button'))) continue;

        if (touch.clientX < window.innerWidth / 2 && moveTouchId === null) {
          moveTouchId = touch.identifier;
          moveStart = { x: touch.clientX, y: touch.clientY };
        } else if (touch.clientX >= window.innerWidth / 2 && lookTouchId === null) {
          lookTouchId = touch.identifier;
          lookStart = { x: touch.clientX, y: touch.clientY };
        }
      }
    });

    window.addEventListener('touchmove', (e) => {
      if (!isGameStarted || isGameOver || isGameClear) return;
      for (let touch of e.changedTouches) {
        if (touch.identifier === moveTouchId) {
          moveDir.side = Math.min(Math.max((touch.clientX - moveStart.x) / 40, -1), 1);
          moveDir.forward = Math.min(Math.max(-(touch.clientY - moveStart.y) / 40, -1), 1);
        } else if (touch.identifier === lookTouchId) {
          cameraRotation.yaw -= (touch.clientX - lookStart.x) * 0.005;
          cameraRotation.pitch = Math.max(-1.2, Math.min(1.2, cameraRotation.pitch - (touch.clientY - lookStart.y) * 0.005));
          lookStart = { x: touch.clientX, y: touch.clientY };
        }
      }
    });

    const endTouch = (e) => {
      for (let touch of e.changedTouches) {
        if (touch.identifier === moveTouchId) { moveTouchId = null; moveDir = { forward: 0, side: 0 }; }
        if (touch.identifier === lookTouchId) { lookTouchId = null; }
      }
    };
    window.addEventListener('touchend', endTouch);
    window.addEventListener('touchcancel', endTouch);

    const normalSpeed = 0.07;
    const dashSpeed = 0.12;
    const chaseSpeed = 0.078;
    const patrolSpeed = 0.035;

    function animate() {
      if (!isGameStarted || isGameOver || isGameClear) return;
      animationFrameId = requestAnimationFrame(animate);

      const now = performance.now();
      const delta = (now - lastTime) / 1000;
      lastTime = now;

      // キーボード ＋ タッチ入力統合
      let keyForward = 0;
      let keySide = 0;
      if (keys['KeyW'] || keys['ArrowUp']) keyForward += 1;
      if (keys['KeyS'] || keys['ArrowDown']) keyForward -= 1;
      if (keys['KeyA'] || keys['ArrowLeft']) keySide -= 1;
      if (keys['KeyD'] || keys['ArrowRight']) keySide += 1;

      const totalForward = moveDir.forward || keyForward;
      const totalSide = moveDir.side || keySide;
      const totalDash = isDashing || keys['ShiftLeft'] || keys['ShiftRight'];

      // バッテリー消費
      if (isLightOn && battery > 0) {
        battery -= delta * 0.2;
        if (battery <= 0) {
          battery = 0;
          setLightState(false);
          lightBtn.innerText = 'ライト 0%';
        }
      }
      batteryValEl.innerText = Math.ceil(battery);

      // スタミナ＆ダッシュ制御
      const isMoving = (totalForward !== 0 || totalSide !== 0);
      let currentSpeed = normalSpeed;

      if (totalDash && stamina > 0 && isMoving) {
        currentSpeed = dashSpeed;
        stamina -= delta * 25;
        if (stamina <= 0) { stamina = 0; isDashing = false; }
      } else {
        if (stamina < 100) { stamina += delta * 15; if (stamina > 100) stamina = 100; }
      }
      staminaValEl.innerText = Math.ceil(stamina);

      // 暗闇ペナルティ（5秒で急襲）
      if (battery <= 0) {
        noBatteryTime += delta;
        warningText.style.display = 'block';
        warningText.innerText = `⚠️ 闇の中！残り ${(Math.max(0, 5 - noBatteryTime)).toFixed(1)}秒で急襲！`;

        if (noBatteryTime >= 5.0) {
          const frontDir = new THREE.Vector3(0, 0, -1.2).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.yaw);
          enemy.position.copy(camera.position).add(frontDir);
          enemy.position.y = 1.6;
          triggerGameOver("暗闇の中で捕まった...");
          return;
        }
      } else {
        noBatteryTime = 0;
        warningText.style.display = 'none';
      }

      // バッテリー回収
      for (let i = batteries.length - 1; i >= 0; i--) {
        const batt = batteries[i];
        batt.rotation.y += delta * 2;
        if (camera.position.distanceTo(batt.position) < 1.5) {
          battery = 100;
          setLightState(true);
          scene.remove(batt);
          batteries.splice(i, 1);
          spawnBattery();
        }
      }

      // PCパーツ回収
      for (let i = pcParts.length - 1; i >= 0; i--) {
        const part = pcParts[i];
        part.rotation.y += delta * 3;
        if (camera.position.distanceTo(part.position) < 1.8) {
          collectedParts++;
          partsValEl.innerText = collectedParts;
          scene.remove(part);
          pcParts.splice(i, 1);

          if (collectedParts >= totalParts) {
            warningText.style.display = 'block';
            warningText.style.color = '#00ffff';
            warningText.innerText = '⚡ パーツが揃った！トンネル奥のPCを起動しろ！';
          }
        }
      }

      // トンネルPCクリア判定
      if (collectedParts >= totalParts) {
        if (camera.position.distanceTo(pcGroup.position) < 2.5) {
          triggerGameClear();
          return;
        }
      }

      // 🚶 物理衝突判定（移動計算）
      camera.rotation.order = 'YXZ';
      camera.rotation.y = cameraRotation.yaw;
      camera.rotation.x = cameraRotation.pitch;

      const oldX = camera.position.x;
      const oldZ = camera.position.z;

      const forward = new THREE.Vector3(0, 0, -1).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.yaw);
      const side = new THREE.Vector3(1, 0, 0).applyAxisAngle(new THREE.Vector3(0, 1, 0), cameraRotation.yaw);
      
      camera.position.addScaledVector(forward, totalForward * currentSpeed);
      camera.position.addScaledVector(side, totalSide * currentSpeed);

      // 🛑 1. 木との衝突
      for (let t of treeColliders) {
        const dx = camera.position.x - t.x;
        const dz = camera.position.z - t.z;
        const distSq = dx * dx + dz * dz;
        const minDist = t.radius + 0.3;
        if (distSq < minDist * minDist) {
          const dist = Math.sqrt(distSq);
          if (dist > 0) {
            const push = minDist - dist;
            camera.position.x += (dx / dist) * push;
            camera.position.z += (dz / dist) * push;
          }
        }
      }

      // 🛑 2. ガードレールとの衝突
      if (camera.position.z < 60 && camera.position.z > -50) {
        const inGap = isInsideGap(camera.position.z);
        if (!inGap) {
          if (oldX >= -5.0 && oldX <= 5.0) {
            if (camera.position.x < -5.0) camera.position.x = -5.0;
            if (camera.position.x > 5.0) camera.position.x = 5.0;
          }
          else if (oldX > 5.0 && camera.position.x < 5.3) camera.position.x = 5.3;
          else if (oldX < -5.0 && camera.position.x > -5.3) camera.position.x = -5.3;
        }
      }

      // 🛑 3. 🚇 山肌・トンネルのすり抜けを完全に防ぐ厳格な衝突判定
      if (camera.position.z <= -50) {
        // トンネルの内部（幅は -4.5 ～ 4.5）にいる場合
        if (camera.position.x > -4.5 && camera.position.x < 4.5) {
          if (camera.position.z < -84) camera.position.z = -84; // 奥の行き止まり
        } else {
          // トンネルの幅の外（＝山肌やトンネルの横壁の外側）にいる場合、絶対に内部や山の中に入れないようにブロック
          if (oldZ > -50) {
            camera.position.z = -50; // 正面から山に突っ込んだ場合
          } else {
            // トンネルの横壁や山肌の側面・背後からのすり抜けブロック
            if (oldX <= -4.5 && camera.position.x > -4.5) camera.position.x = -4.5;
            if (oldX >= 4.5 && camera.position.x < 4.5) camera.position.x = 4.5;
            if (camera.position.z < -68) camera.position.z = -68; // 山の奥行きより後ろに行かせない
          }
        }
      }

      // マップ外周境界
      camera.position.x = Math.max(-68, Math.min(68, camera.position.x));
      camera.position.z = Math.max(-84, Math.min(64, camera.position.z));

      // こくにいAI
      const vecToPlayer = new THREE.Vector3().subVectors(camera.position, enemy.position);
      vecToPlayer.y = 0;
      const distToPlayer = vecToPlayer.length();

      if (enemyState === 'PATROL') {
        if (distToPlayer < 18) {
          const angle = enemyMoveDir.angleTo(vecToPlayer.clone().normalize());
          if (angle < Math.PI / 3 || distToPlayer < 7) {
            enemyState = 'CHASE';
          }
        }
      } else if (enemyState === 'CHASE') {
        if (distToPlayer > 20) {
          enemyState = 'PATROL';
          getNewPatrolTarget();
        }
      }

      if (enemyState === 'CHASE') {
        const chaseDir = vecToPlayer.clone().normalize();
        enemy.position.addScaledVector(chaseDir, chaseSpeed);
        enemyMoveDir.copy(chaseDir);
      } else {
        const vecToTarget = new THREE.Vector3().subVectors(patrolTarget, enemy.position);
        vecToTarget.y = 0;
        if (vecToTarget.length() < 1.5) {
          getNewPatrolTarget();
        } else {
          const patrolDir = vecToTarget.normalize();
          enemy.position.addScaledVector(patrolDir, patrolSpeed);
          enemyMoveDir.copy(patrolDir);
        }
      }

      // 🔊 音量リアルタイム制御
      if (enemyState === 'CHASE' && distToPlayer < 18) {
        if (bgm.paused) {
          bgm.currentTime = 0;
          bgm.play().catch(e => console.log(e));
        }
        const ratio = Math.max(0, 1 - (distToPlayer / 18));
        const targetVolume = Math.pow(ratio, 1.2) * 0.8;
        if (bgmGainNode) bgmGainNode.gain.value = targetVolume;
      } else {
        if (!bgm.paused) {
          bgm.pause();
          bgm.currentTime = 0;
        }
        if (bgmGainNode) bgmGainNode.gain.value = 0;
      }

      // 当たり判定
      if (distToPlayer < 1.5) {
        triggerGameOver("こくにいに捕まった！");
      }

      renderer.render(scene, camera);
    }

    function triggerGameOver(reason) {
      isGameOver = true;
      if (document.exitPointerLock) document.exitPointerLock();
      bgm.pause();
      if (bgmGainNode) bgmGainNode.gain.value = 0;
      jumpScareVoice.play().catch(()=>{});
      document.getElementById('death-reason').innerText = reason;
      document.getElementById('game-over').style.display = 'flex';
      lightBtn.style.display = 'none';
      dashBtn.style.display = 'none';
    }

    function triggerGameClear() {
      isGameClear = true;
      if (document.exitPointerLock) document.exitPointerLock();
      bgm.pause();
      if (bgmGainNode) bgmGainNode.gain.value = 0;
      document.getElementById('game-clear').style.display = 'flex';
      lightBtn.style.display = 'none';
      dashBtn.style.display = 'none';
    }

    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });
  </script>
</body>
