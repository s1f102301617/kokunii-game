<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, viewport-fit=cover">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0">
  <meta name="apple-mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>恐怖の森 - こくにいVer.</title>
  <style>
    body{margin:0;overflow:hidden;background:#000;font-family:sans-serif;touch-action:none;user-select:none}
    #rotate-notice{display:none;position:absolute;top:0;left:0;width:100vw;height:100vh;background:#0a0a0c;color:#fff;z-index:200;flex-direction:column;justify-content:center;align-items:center;text-align:center;padding:20px;box-sizing:border-box}
    @media(orientation:portrait) and (max-width:768px){#rotate-notice{display:flex}}
    .screen{position:absolute;top:0;left:0;width:100vw;height:100vh;display:flex;flex-direction:column;justify-content:center;align-items:center;z-index:100;text-align:center;color:#fff}
    #start-screen{background:rgba(0,0,0,0.95)} #game-over{display:none;background:rgba(180,0,0,0.95);z-index:150} #game-clear{display:none;background:rgba(0,100,180,0.95);z-index:150}
    h1{font-size:2rem;margin-bottom:10px} #start-screen h1{color:#f33;text-shadow:0 0 10px #f00} #game-clear h1{font-size:2.5rem;color:#0ff;text-shadow:0 0 15px #0ff}
    .btn{font-weight:bold;cursor:pointer;border:none;border-radius:30px}
    #start-btn{font-size:1.3rem;padding:16px 36px;background:#f33;color:#fff;box-shadow:0 4px 15px rgba(255,51,51,0.5);margin-top:15px}
    #update-btn{margin-top:15px;font-size:0.85rem;padding:8px 16px;background:#333;color:#aaa;border:1px solid #555;border-radius:15px}
    .action-btn{font-size:1.1rem;padding:12px 24px;border-radius:25px;box-shadow:0 4px 10px rgba(0,0,0,0.3)}
    #ui-top-left{position:absolute;top:15px;left:15px;display:flex;flex-direction:column;gap:8px;z-index:10;display:none;pointer-events:none}
    .battery-container{display:flex;align-items:center}
    .battery-icon{width:32px;height:16px;border:2px solid #fff;border-radius:4px;position:relative;padding:1px;box-sizing:border-box;box-shadow:0 0 5px rgba(0,0,0,0.8)}
    .battery-icon::after{content:'';position:absolute;top:3px;right:-5px;width:3px;height:6px;background:#fff;border-radius:0 2px 2px 0}
    .battery-level{height:100%;background:#0f0;width:100%;transition:width 0.2s linear,background-color 0.2s;border-radius:1px}
    .stamina-container{display:flex;align-items:center;gap:6px} .stamina-icon{font-size:1.1rem;line-height:1;text-shadow:0 0 5px rgba(0,0,0,0.8)}
    .stamina-bar-bg{width:80px;height:8px;background:rgba(0,0,0,0.6);border:1px solid rgba(255,255,255,0.4);border-radius:4px;overflow:hidden;box-shadow:0 0 5px rgba(0,0,0,0.8)}
    .stamina-level{height:100%;background:#0ff;width:100%;transition:width 0.1s linear}
    .parts-container{display:flex;gap:4px;margin-top:2px}
    .part-icon{width:14px;height:14px;background:rgba(0,0,0,0.6);border:2px solid rgba(0,255,102,0.3);border-radius:3px;box-sizing:border-box;box-shadow:0 0 5px rgba(0,0,0,0.8)}
    .part-icon.active{background:#0f6;border-color:#0f6;box-shadow:0 0 8px #0f6}
    .game-btn{position:absolute;z-index:50;display:none;touch-action:manipulation}
    #light-btn{top:15px;right:15px;padding:10px 18px;font-size:0.9rem;background:rgba(255,255,255,0.85);color:#000}
    #dash-btn{bottom:25px;right:25px;padding:16px 28px;font-size:1.1rem;background:rgba(255,140,0,0.85);color:#fff;box-shadow:0 4px 10px rgba(0,0,0,0.5)}
  </style>
</head>
<body>
  <div id="rotate-notice"><div style="font-size:3.5rem;margin-bottom:15px">📱↪️</div><h2 style="margin:0 0 10px">画面を横にしてください</h2></div>
  <div id="start-screen" class="screen">
    <h1>恐怖の森 - こくにいVer.<span style="font-size:0.85rem;color:#888;margin-left:6px">v5.5.0</span></h1>
    <p style="font-size:0.8rem;opacity:0.6;line-height:1.4">【PC】WASD:移動 / マウス:視点 / Shift:走る / F:ライト<br>【スマホ】左ドラッグ:移動 / 右ドラッグ:視点</p>
    <button id="start-btn" class="btn">🎮 ゲームスタート</button>
    <button id="update-btn" class="btn">🔄 最新版にアップデート</button>
  </div>

  <div id="ui-top-left">
    <div class="battery-container"><div class="battery-icon"><div class="battery-level" id="bat-lv"></div></div></div>
    <div class="stamina-container"><span class="stamina-icon">🏃</span><div class="stamina-bar-bg"><div class="stamina-level" id="sta-lv"></div></div></div>
    <div class="parts-container" id="parts-icons"><div class="part-icon"></div><div class="part-icon"></div><div class="part-icon"></div><div class="part-icon"></div></div>
    <div id="warn-txt" style="color:#f33;font-weight:bold;margin-top:5px;display:none;font-size:0.85rem;text-shadow:1px 1px 2px #000"></div>
  </div>

  <button id="light-btn" class="btn game-btn">ライト ON</button>
  <button id="dash-btn" class="btn game-btn">🏃 走る</button>

  <div id="game-over" class="screen"><h1 id="death-txt">捕まった...</h1><div style="display:flex;gap:12px;margin-top:20px"><button class="btn action-btn" style="background:#f33;color:#fff" onclick="location.reload()">🎮 再プレイ</button></div></div>
  <div id="game-clear" class="screen"><h1>脱出成功！</h1><p>無事に森から脱出できた！</p><div style="display:flex;gap:12px;margin-top:20px"><button class="btn action-btn" style="background:#fff;color:#000" onclick="location.reload()">🏠 タイトルへ</button></div></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const el = id => document.getElementById(id);
    el('update-btn').onclick = () => location.href = location.pathname + '?v=' + Date.now();
    
    // 🎵 音声処理のバグを完全修正（安全なロードと再生）
    const A = (s, v=1, l=false) => { let a = new Audio(s); a.volume=v; a.loop=l; return a; };
    const bEnv = A('夏の田舎の夜.mp3', 0.5, true), bChase = A('bgm.mp3', 0, true), overV = A('夏の山2.mp3');
    const sRW = A('アスファルトの上を歩く1.mp3', 0.6, true), sRD = A('アスファルトの上を歩く2.mp3', 0.9, true), sG = A('芝生の上を歩く.mp3', 0.7, true);
    
    // スマホでもループが途切れないようにする処理
    [bEnv, bChase, sRW, sRD, sG].forEach(a => a.addEventListener('ended', function(){ this.currentTime=0; this.play().catch(()=>{}); }));
    let actStep = null;

    // 🎨 テクスチャ生成
    const mkT = (w,h,f, rx=1,ry=1) => { const c=document.createElement('canvas'); c.width=w; c.height=h; f(c.getContext('2d')); const t=new THREE.CanvasTexture(c); if(rx!==1||ry!==1){t.wrapS=t.wrapT=THREE.RepeatWrapping; t.repeat.set(rx,ry);} return t; };
    const tGrs = mkT(256,256, x=>{x.fillStyle='#0a0f07';x.fillRect(0,0,256,256);for(let i=0;i<4000;i++){x.fillStyle=Math.random()>0.6?'#050804':(Math.random()>0.2?'#101a0d':'#17140e');x.fillRect(Math.random()*256,Math.random()*256,2,3);}}, 40,40);
    const tRod = mkT(256,512, x=>{x.fillStyle='#141416';x.fillRect(0,0,256,512);for(let i=0;i<8000;i++){x.fillStyle=`rgba(${~~(Math.random()*25)},${~~(Math.random()*25)},${~~(Math.random()*25)},0.2)`;x.fillRect(Math.random()*256,Math.random()*512,2,2);}x.strokeStyle='#08080a';x.lineWidth=2;for(let i=0;i<15;i++){x.beginPath();let cx=Math.random()*256,cy=Math.random()*512;x.moveTo(cx,cy);for(let j=0;j<5;j++){cx+=(Math.random()-0.5)*30;cy+=(Math.random()-0.5)*30;x.lineTo(cx,cy);}x.stroke();}x.fillStyle='rgba(160,160,160,0.35)';x.fillRect(122,40,12,160);x.fillRect(122,300,12,160);}, 1,20);
    const tCon = mkT(256,256, x=>{x.fillStyle='#1c1c20';x.fillRect(0,0,256,256);for(let i=0;i<8000;i++){x.fillStyle=`rgba(${~~(Math.random()*30)},${~~(Math.random()*30)},${~~(Math.random()*30)},0.25)`;x.fillRect(Math.random()*256,Math.random()*256,2,2);}}, 2,6);
    const tWrn = mkT(512,128, x=>{x.fillStyle='#222225';x.fillRect(0,0,512,128);x.fillStyle='#9e7308';for(let i=-512;i<1024;i+=64){x.beginPath();x.moveTo(i,0);x.lineTo(i+32,0);x.lineTo(i-32,128);x.lineTo(i-64,128);x.fill();}});
    const tClf = mkT(512,512, x=>{x.fillStyle='#0a0d08';x.fillRect(0,0,512,512);for(let i=0;i<35000;i++){x.fillStyle=`rgba(${~~(Math.random()*20)},${~~(Math.random()*20)+2},${~~(Math.random()*20)},0.7)`;x.fillRect(Math.random()*512,Math.random()*512,1.5+Math.random()*3,1.5+Math.random()*3);}x.strokeStyle='#040503';for(let i=0;i<40;i++){x.lineWidth=1+Math.random()*4;x.beginPath();let cx=Math.random()*512,cy=Math.random()*512;x.moveTo(cx,cy);for(let j=0;j<8;j++){cx+=(Math.random()-0.5)*70;cy+=(Math.random()-0.5)*70;x.lineTo(cx,cy);}x.stroke();}}, 4,2);
    const tFnc = mkT(128,128, x=>{x.strokeStyle='#7a7c78';x.lineWidth=2;x.beginPath();for(let i=-128;i<=256;i+=16){x.moveTo(i,0);x.lineTo(i+128,128);x.moveTo(i+128,0);x.lineTo(i,128);}x.stroke();});

    // 3Dシーン
    const sc = new THREE.Scene(); sc.fog = new THREE.FogExp2(0x030305, 0.045);
    const cam = new THREE.PerspectiveCamera(90, innerWidth/innerHeight, 0.1, 1000);
    const ren = new THREE.WebGLRenderer({ antialias: false }); ren.setSize(innerWidth, innerHeight); document.body.appendChild(ren.domElement);
    
    const amb = new THREE.AmbientLight(0x181822, 0.12); sc.add(amb);
    const fl = new THREE.SpotLight(0xfffae6, 10, 55, Math.PI/3, 0.6, 1.8); cam.add(fl); fl.target.position.set(0,0,-5); cam.add(fl.target);
    const pL = new THREE.PointLight(0xfffae6, 0.15, 5); cam.add(pL); sc.add(cam);

    function setLight(o) { lt=o; fl.visible=o; pL.visible=o; amb.intensity=o?0.12:0.015; el('light-btn').innerText=o?'ライト ON':'ライト OFF'; }
    function addM(g,m,x,y,z, rx=0,ry=0,rz=0){ const mh=new THREE.Mesh(g,m); mh.position.set(x,y,z); mh.rotation.set(rx,ry,rz); sc.add(mh); return mh; }

    const M = (c,r,m,map) => new THREE.MeshStandardMaterial(map?{map:map,roughness:r,side:THREE.DoubleSide,transparent:c==='f'}:{color:c,roughness:r,metalness:m});
    const mGrs=M(0,0.95,0,tGrs), mRod=M(0,0.9,0,tRod), mGrd=M(0x888888,0.6,0.5), mRst=M(0x5a2d18,0.9,0), mClf=M(0,1,0,tClf), mCon=M(0,0.9,0,tCon), mFnc=M('f',0.4,0.6,tFnc);

    addM(new THREE.PlaneGeometry(500,500), mGrs, 0,0,0, -1.57); addM(new THREE.PlaneGeometry(10,240), mRod, 0,0.02,10, -1.57);
    
    // ガードレール＆フェンス等
    const isG = z => (z>35&&z<60)||(z>0&&z<18)||(z>-35&&z<-20);
    for(let z=-45; z<=120; z+=6){ if(isG(z)){if(Math.random()>0.3)addM(new THREE.BoxGeometry(0.2,0.5,4.5),mRst,Math.random()>0.5?5.3:-5.3,0.2,z,0,(Math.random()-0.5)*0.8,(Math.random()-0.5)*1.2);continue;} addM(new THREE.BoxGeometry(0.15,0.5,5.8),mGrd,-5.2,0.8,z); addM(new THREE.BoxGeometry(0.15,0.5,5.8),mGrd,5.2,0.8,z); }
    const bG=new THREE.Group(); bG.position.set(0,0,65); bG.add(new THREE.Mesh(new THREE.BoxGeometry(10,1.2,0.2), M(0x992222,0.7,0)).translateY(1.2)); const pM=M(0x888888,0.5,0.8), pG=new THREE.CylinderGeometry(0.1,0.1,2.2); bG.add(new THREE.Mesh(pG,pM).translateX(-4.5).translateY(1.1), new THREE.Mesh(pG,pM).translateX(4.5).translateY(1.1)); sc.add(bG);

    function bFn(x1,z1,x2,z2) {
      const dx=x2-x1, dz=z2-z1, ln=Math.hypot(dx,dz), a=Math.atan2(dx,dz), fm=mFnc.clone(); fm.map=fm.map.clone(); fm.map.repeat.set(ln/4,2);
      addM(new THREE.PlaneGeometry(ln,4), fm, x1+dx/2, 2, z1+dz/2).rotation.y = a+1.57;
      const tG=new THREE.CylinderGeometry(0.08,0.08,4), tm=M(0x333,0.5,0.8);
      for(let i=0; i<=ln; i+=4) addM(tG, tm, x1+dx*(i/ln), 2, z1+dz*(i/ln));
      addM(new THREE.BoxGeometry(ln,0.1,0.1), tm, x1+dx/2, 4, z1+dz/2).rotation.y = a+1.57;
    }
    bFn(-129.5,-49.5,-84,-49.5); bFn(84,-49.5,129.5,-49.5); bFn(-129.5,-49.5,-129.5,129.5); bFn(129.5,-49.5,129.5,129.5); bFn(-129.5,129.5,129.5,129.5);

    // 山肌とトンネル
    addM(new THREE.BoxGeometry(80,30,45), mClf, -46,15,-73); addM(new THREE.BoxGeometry(80,30,45), mClf, 46,15,-73); addM(new THREE.BoxGeometry(12,22,45), mClf, 0,19,-73);
    addM(new THREE.CylinderGeometry(5,5,35,32,1,true,0,Math.PI), mCon, 0,2,-67.5, 1.57,1.57); addM(new THREE.BoxGeometry(0.5,2,35), mCon, -5.25,1,-67.5); addM(new THREE.BoxGeometry(0.5,2,35), mCon, 5.25,1,-67.5); addM(new THREE.BoxGeometry(11,8,1), mCon, 0,4,-85.5);
    const shp=new THREE.Shape(); shp.moveTo(-20,0); shp.lineTo(20,0); shp.lineTo(20,15); shp.lineTo(-20,15); shp.lineTo(-20,0); const hl=new THREE.Path(); hl.moveTo(-5,0); hl.lineTo(-5,2); hl.absarc(0,2,5,Math.PI,0,true); hl.lineTo(5,0); hl.lineTo(-5,0); shp.holes.push(hl);
    const fGeo=new THREE.ExtrudeGeometry(shp, {depth:0.5,bevelEnabled:false}); for(let i=0;i<fGeo.attributes.position.count;i++) fGeo.attributes.uv.setXY(i,fGeo.attributes.position.getX(i)/8,fGeo.attributes.position.getY(i)/8);
    addM(fGeo, mCon, 0,0,-50.25); addM(new THREE.BoxGeometry(1,9,1.5), mCon, -5.5,4.5,-49.5); addM(new THREE.BoxGeometry(1,9,1.5), mCon, 5.5,4.5,-49.5); addM(new THREE.BoxGeometry(12,1.5,1.6), M(0,0.8,0,tWrn), 0,9.25,-49.5);
    [-58,-68,-78].forEach(z=>{ addM(new THREE.BoxGeometry(0.3,0.4,0.2), new THREE.MeshBasicMaterial({color:0xf60}), -4.8,4,z); const l=new THREE.PointLight(0xf60,1.5,12); l.position.set(-4.4,4,z); sc.add(l); });

    // PCデスクとランドマーク
    const dsM=M(0x2b2b2b,0.8,0.3), pcM=M(0x111,0.5,0);
    addM(new THREE.BoxGeometry(2.6,0.1,1.2), dsM, 0,1,-83.5); addM(new THREE.BoxGeometry(0.1,1,1), dsM, -1.2,0.5,-83.5); addM(new THREE.BoxGeometry(0.1,1,1), dsM, 1.2,0.5,-83.5);
    addM(new THREE.BoxGeometry(0.9,0.04,0.6), pcM, 0,1.07,-83.3); addM(new THREE.BoxGeometry(0.7,0.02,0.25), M(0x0a0a0a,0,0), 0,1.08,-83.25);
    const pcMon = addM(new THREE.BoxGeometry(0.9,0.6,0.04), pcM, 0,1.35,-83.55, -0.15); addM(new THREE.PlaneGeometry(0.85,0.55), new THREE.MeshStandardMaterial({color:0xfff,emissive:0x05f,emissiveIntensity:1}), 0,1.35,-83.52, -0.15);
    const pcL=new THREE.PointLight(0x08f,1.5,6); pcL.position.set(0,1.5,-83); sc.add(pcL);

    const cls = []; const cM=M(0x881111,0.8,0); addM(new THREE.BoxGeometry(2.2,1.2,4.2), cM, -25,0.6,15, 0,0.4,0.1); addM(new THREE.BoxGeometry(1.8,0.8,2.2), cM, -25,1.4,14.5, 0,0.4,0.1); cls.push({x:-25,z:15,r:2.2});
    addM(new THREE.CylinderGeometry(1.5,1.5,1.2,12,1,true), M(0x444,0.9,0), 30,0.6,-10); cls.push({x:30,z:-10,r:1.6});

    // 🌲 リアル針葉樹
    const trG = new THREE.CylinderGeometry(0.3,0.6,3.5,6), tm = M(0x110a05,1,0), lm = M(0x050d05,0.9,0);
    const lGs = [new THREE.ConeGeometry(2.6,3.5,7), new THREE.ConeGeometry(2.1,3.5,7), new THREE.ConeGeometry(1.6,3.5,7), new THREE.ConeGeometry(1.1,3.5,7)];
    function addTr(x, z, s=1, r=0.7) {
      if(z>-48 && Math.hypot(x,z)<6) return;
      const t = new THREE.Group(); const tr = new THREE.Mesh(trG, tm); tr.position.y=1.75; t.add(tr);
      for(let j=0; j<4; j++) { const l = new THREE.Mesh(lGs[j], lm); l.position.y = 3.5+j*1.4; l.rotation.set((Math.random()-0.5)*0.15, Math.random()*Math.PI, (Math.random()-0.5)*0.15); t.add(l); }
      t.scale.set(s,s,s); t.position.set(x,0,z); t.rotation.y = Math.random()*Math.PI; sc.add(t); cls.push({x,z,r});
    }
    for(let i=0;i<120;i++){ let x=(Math.random()-0.5)*140, z=(Math.random()-0.5)*120; if(Math.abs(x)<7) x+=x>=0?8:-8; if(z>-48) addTr(x,z); }
    for(let i=0;i<350;i++){ let r=75+Math.random()*120, a=Math.random()*Math.PI*2, x=Math.cos(a)*r, z=Math.sin(a)*r; if(!(z<-45 && Math.abs(x)<20)) addTr(x,z,1.2,1); }

    const bats=[], pts=[], bGeo=new THREE.CylinderGeometry(0.2,0.2,0.5,8), bMat=new THREE.MeshStandardMaterial({color:0xff0,emissive:0x880}), pGeo=new THREE.BoxGeometry(0.5,0.2,0.4), pMat=new THREE.MeshStandardMaterial({color:0x0f6,emissive:0x0a4});
    function spn(a,g,m){ for(let i=0;i<(a===pts?4:8);i++){ let x=(Math.random()-0.5)*(a===pts?90:110), z=(Math.random()-0.5)*100; if(z<-45) z=0; a.push(addM(g,m,x,0.3,z)); } }
    
    const eny = new THREE.Sprite(new THREE.SpriteMaterial({map: new THREE.TextureLoader().load('kokunii.PNG')})); eny.scale.set(3.5,3.5,1); sc.add(eny);

    let run=false, over=false, clr=false, lt=true, dash=false, bat=100, sta=100, pCnt=0, nbT=0, eSt='P', pTg=new THREE.Vector3(), eDr=new THREE.Vector3(0,0,1), ltT=0, hbT=0;
    const ks={y:0, p:0}; let mTch=null, lTch=null, mSt={x:0,y:0}, lSt={x:0,y:0}, mDr={f:0,s:0};
    
    ren.domElement.onclick = () => { if(run && !('ontouchstart' in window)) ren.domElement.requestPointerLock(); };
    document.onmousemove = e => { if(document.pointerLockElement) { ks.y-=e.movementX*0.0025; ks.p=Math.max(-1.2,Math.min(1.2,ks.p-e.movementY*0.0025)); } };
    ['mousedown','touchstart'].forEach(e => {
      el('light-btn').addEventListener(e, ev=>{ ev.preventDefault(); ev.stopPropagation(); if(run&&bat>0) setLight(!lt); }, {passive:false});
      el('dash-btn').addEventListener(e, ev=>{ ev.preventDefault(); ev.stopPropagation(); if(run&&sta>0) dash=true; }, {passive:false});
    });
    ['mouseup','touchend','touchcancel'].forEach(e => el('dash-btn').addEventListener(e, ev=>{ ev.preventDefault(); dash=false; }));
    
    // ★ ここで音声の確実なロードと、メインBGMのみを再生
    el('start-btn').onclick = () => {
      [bEnv, bChase, overV, sRW, sRD, sG].forEach(a => a.load());
      bEnv.currentTime=0; bEnv.play().catch(()=>{});
      
      run=true; ks.y=ks.p=0; cam.position.set(0,1.8,25); pTg.set((Math.random()-0.5)*250,1.85,(Math.random()-0.5)*250);
      spn(bats,bGeo,bMat); spn(pts,pGeo,pMat);
      el('start-screen').style.display='none'; el('ui-top-left').style.display='flex';
      if('ontouchstart' in window){ el('light-btn').style.display='block'; el('dash-btn').style.display='block'; }
      ltT=performance.now(); anm();
    };

    window.onkeydown = e => { ks[e.code]=true; if(e.code==='KeyF'&&run&&bat>0) setLight(!lt); }; window.onkeyup = e => ks[e.code]=false;
    window.ontouchstart = e => { if(!run||over||clr) return; for(let t of e.changedTouches){ if(t.clientX<innerWidth/2&&!mTch){ mTch=t.identifier; mSt={x:t.clientX,y:t.clientY}; } else if(t.clientX>=innerWidth/2&&!lTch&&!e.target.closest('button')){ lTch=t.identifier; lSt={x:t.clientX,y:t.clientY}; } } };
    window.ontouchmove = e => { if(!run||over||clr) return; for(let t of e.changedTouches){ if(t.identifier===mTch){ mDr.s=Math.min(Math.max((t.clientX-mSt.x)/40,-1),1); mDr.f=Math.min(Math.max(-(t.clientY-mSt.y)/40,-1),1); } else if(t.identifier===lTch){ ks.y-=(t.clientX-lSt.x)*0.005; ks.p=Math.max(-1.2,Math.min(1.2,ks.p-(t.clientY-lSt.y)*0.005)); lSt={x:t.clientX,y:t.clientY}; } } };
    window.ontouchend = e => { for(let t of e.changedTouches){ if(t.identifier===mTch){ mTch=null; mDr={f:0,s:0}; } if(t.identifier===lTch) lTch=null; } };

    function anm() {
      if(!run||over||clr) return; requestAnimationFrame(anm);
      const dt=(performance.now()-ltT)/1000; ltT=performance.now();
      
      const tF=mDr.f+(ks['KeyW']||ks['ArrowUp']?1:0)-(ks['KeyS']||ks['ArrowDown']?1:0); const tS=mDr.s+(ks['KeyD']||ks['ArrowRight']?1:0)-(ks['KeyA']||ks['ArrowLeft']?1:0);
      const mv=tF!==0||tS!==0, spd=(dash||ks['ShiftLeft']?0.12:0.07);

      if(mv) { hbT+=dt*(spd>0.1?14:8); cam.position.y=1.8+Math.sin(hbT)*(spd>0.1?0.08:0.04); } else { cam.position.y=1.8; }
      
      // ★ 足音のバグ修正版（遅延再生によるエラーを握りつぶす）
      if(mv) {
        let ts = Math.abs(cam.position.x)<=5.5 ? (spd>0.1?sRD:sRW) : sG;
        if(ts===sG) ts.playbackRate=spd>0.1?1.4:1;
        if(actStep!==ts){ 
          if(actStep){ actStep.pause(); actStep.currentTime=0; } 
          actStep=ts; 
          let p = actStep.play();
          if(p !== undefined) p.catch(()=>{});
        }
      } else { 
        if(actStep){ actStep.pause(); actStep.currentTime=0; actStep=null; } 
      }

      if(lt&&bat>0){ bat-=dt*0.2; if(bat<=0){ bat=0; setLight(false); } } 
      const bLv=el('bat-lv'); bLv.style.width=bat+'%'; bLv.style.backgroundColor=bat>20?'#0f0':'#f00';
      if(spd>0.1&&stam>0&&mv){ sta-=dt*25; if(sta<=0){ sta=0; dash=false; } }else if(sta<100) sta=Math.min(100,sta+dt*15); el('sta-lv').style.width=sta+'%';
      
      const w=el('warn-txt');
      if(bat<=0){ nbT+=dt; w.style.display='block'; w.innerText=`⚠️ ${(Math.max(0,5-nbT)).toFixed(1)}秒で急襲`; if(nbT>=5){ eny.position.copy(cam.position).add(new THREE.Vector3(0,0,-1.2).applyAxisAngle(new THREE.Vector3(0,1,0),ks.y)); eny.position.y=1.85; over=true; endG("暗闇で捕まった"); return; } }
      else { nbT=0; if(pCnt>=4){ w.style.color='#0ff'; w.style.display='block'; w.innerText='⚡ PCを起動しろ'; }else w.style.display='none'; }

      [bats, parts].forEach((a, idx) => {
        for(let i=a.length-1; i>=0; i--){
          a[i].rotation.y+=dt*(idx?3:2);
          if(Math.hypot(cam.position.x-a[i].position.x, cam.position.z-a[i].position.z)<1.5){
            sc.remove(a[i]); a.splice(i,1);
            if(!idx){ bat=100; setLight(true); spn(bats,bGeo,bMat); } else { pCnt++; const pI=el('parts-icons').children; for(let j=0;j<4;j++) if(j<pCnt) pI[j].classList.add('active'); }
          }
        }
      });
      if(pCnt>=4 && Math.hypot(cam.position.x-pcMon.position.x, cam.position.z-pcMon.position.z)<2.5) { clr=true; endG("脱出成功", 1); return; }

      cam.rotation.set(ks.p, ks.y, 0, 'YXZ'); const oX=cam.position.x, oZ=cam.position.z;
      cam.position.addScaledVector(new THREE.Vector3(0,0,-1).applyAxisAngle(new THREE.Vector3(0,1,0),ks.y), tF*spd).addScaledVector(new THREE.Vector3(1,0,0).applyAxisAngle(new THREE.Vector3(0,1,0),ks.y), tS*spd);

      for(let t of cls){ let dx=cam.position.x-t.x, dz=cam.position.z-t.z, d=Math.hypot(dx,dz), md=t.r+0.3; if(d>0&&d<md){ cam.position.x+=(dx/d)*(md-d); cam.position.z+=(dz/d)*(md-d); } }
      if(cam.position.z<60&&cam.position.z>-50&&!isGap(cam.position.z)){ if(oX>=-5&&oX<=5) cam.position.x=Math.max(-5,Math.min(5,cam.position.x)); else cam.position.x=oX>5?Math.max(5.3,cam.position.x):Math.min(-5.3,cam.position.x); }
      if(cam.position.z<-49){ if(oZ>=-49&&Math.abs(cam.position.x)>=4.6) cam.position.z=-49; else{ cam.position.x=Math.max(-4.6,Math.min(4.6,cam.position.x)); cam.position.z=Math.max(-84,cam.position.z); } }
      cam.position.set(Math.max(-129,Math.min(129,cam.position.x)), cam.position.y, Math.max(-84,Math.min(129,cam.position.z)));

      const pV=new THREE.Vector3().subVectors(cam.position,eny.position); pV.y=0; const pD=pV.length(), cs=0.075+(pCnt*0.012), dr=16+(pCnt*4)+(lt?8:0);
      if(eSt==='P'){ if(pD<dr){ if(eDr.angleTo(pV.clone().normalize())<1.04 || pD<8) eSt='C'; } }else if(eSt==='C'){ if(pD>dr+8){ eSt='P'; pTgt.set((Math.random()-0.5)*250,1.85,(Math.random()-0.5)*250); } }
      let md = eSt==='C' ? pV.clone().normalize() : new THREE.Vector3().subVectors(pTgt,eny.position).setY(0).normalize();
      if(eSt==='P'&&eny.position.distanceTo(pTgt)<1.5) pTgt.set((Math.random()-0.5)*250,1.85,(Math.random()-0.5)*250);
      eny.position.addScaledVector(md, eSt==='C'?cs:0.035); eny.position.y=1.85; eDr.copy(md);

      // ★ 追跡BGMの途中再生バグ解消版
      if(eSt==='C'&&pD<18){ 
        if(bChase.paused){ bChase.currentTime=0; bChase.play().catch(()=>{}); } 
        bChase.volume = Math.pow(Math.max(0,1-pD/18),1.2)*0.8; 
      }else{ 
        if(!bChase.paused){ bChase.pause(); bChase.currentTime=0; } 
      }
      
      if(pD<1.5) endG("こくにいに捕まった！"); else ren.render(sc, cam);
    }

    function endG(txt, c=0) {
      over=true; 
      if(actStep){ actStep.pause(); actStep=null; } 
      bEnv.pause(); bChase.pause();
      
      // ゲームオーバーならひぐらし再生
      if(!c) { overVoice.currentTime=0; overVoice.play().catch(()=>{}); }
      
      if(document.exitPointerLock) document.exitPointerLock(); 
      if(!c) el('death-reason').innerText=txt; 
      el(c ? 'game-clear' : 'game-over').style.display='flex';
    }
  </script>
</body>
</html>
